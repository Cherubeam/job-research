name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      # Each gate runs even if an earlier one fails, so one push surfaces
      # every problem rather than only the first.
      - name: Lint (ruff)
        if: '!cancelled()'
        run: uv run ruff check src/ tests/

      - name: Format check (black)
        if: '!cancelled()'
        run: uv run black --check src/ tests/

      - name: Type check (mypy)
        if: '!cancelled()'
        run: uv run mypy src/

      - name: Tests (pytest)
        if: '!cancelled()'
        run: uv run pytest tests/ -v --cov=job_research --cov-report=term-missing
