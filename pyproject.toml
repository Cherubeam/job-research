[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-research"
version = "0.3.0"
description = "AI-powered job market research tool for searching and analyzing job listings across German job boards"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    {name = "Marco Braun"}
]
keywords = ["job-research", "gradio", "web-scraping", "job-market"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "anthropic>=0.49.0",
    "gradio>=4.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "lxml>=4.9.0",
    "python-jobspy>=1.1.82",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pandas-stubs>=3.0.5.260730",
    "types-requests>=2.33.0.20260712",
]

[project.scripts]
job-research = "ui.app:main"

[project.urls]
Homepage = "https://github.com/Cherubeam/job-research"
Documentation = "https://github.com/Cherubeam/job-research#readme"
Repository = "https://github.com/Cherubeam/job-research.git"
Issues = "https://github.com/Cherubeam/job-research/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/job_research", "src/ui"]

[tool.black]
line-length = 100
target-version = ['py313']

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

# python-jobspy ships no stubs and no py.typed marker.
[[tool.mypy.overrides]]
module = ["jobspy.*"]
ignore_missing_imports = true
